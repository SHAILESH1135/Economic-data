name: Fetch Mandi Prices Daily

on:
  schedule:
    # 06:00 UTC = 11:30 IST (after market close, before next open)
    - cron: '0 6 * * 1-6'  # Mon-Sat
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  fetch-mandi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests

      - name: Fetch mandi data
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: |
          python3 fetch_mandi_github.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mandi_latest.json mandi_spikes.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update mandi data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit"
          fi